<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sorry</title>
<style>
  :root {
    --sky-top: #050b1f;
    --sky-mid: #0d1b3d;
    --sky-low: #24406b;
    --moon: #fdf8e4;
    --text: #dfe9ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
    font-family: "Georgia", "Palatino Linotype", serif;
  }

  /* stars */
  .stars {
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
      radial-gradient(1px 1px at 27% 8%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 41% 30%, #fff, transparent),
      radial-gradient(1px 1px at 58% 12%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 72% 26%, #fff, transparent),
      radial-gradient(1px 1px at 88% 9%, #fff, transparent),
      radial-gradient(1px 1px at 6% 52%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 93% 48%, #fff, transparent),
      radial-gradient(1px 1px at 20% 72%, #fff, transparent),
      radial-gradient(1px 1px at 66% 66%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 82% 80%, #fff, transparent),
      radial-gradient(1px 1px at 35% 88%, #fff, transparent);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .45; } to { opacity: .95; } }

  /* moon */
  .moon {
    position: fixed;
    top: 9vh; right: 12vw;
    width: min(34vw, 34vh);
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 28%, rgba(0,0,0,.08) 0 6%, transparent 7%),
      radial-gradient(circle at 62% 40%, rgba(0,0,0,.07) 0 9%, transparent 10%),
      radial-gradient(circle at 45% 70%, rgba(0,0,0,.06) 0 7%, transparent 8%),
      radial-gradient(circle at 35% 35%, #fffef5, var(--moon) 60%, #e9e0b8 100%);
    box-shadow:
      0 0 40px 10px rgba(253, 248, 228, .35),
      0 0 120px 50px rgba(160, 190, 255, .25);
    animation: glow 7s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { box-shadow: 0 0 40px 10px rgba(253,248,228,.30), 0 0 100px 40px rgba(160,190,255,.20); }
    to   { box-shadow: 0 0 55px 16px rgba(253,248,228,.45), 0 0 150px 70px rgba(160,190,255,.32); }
  }

  /* typed text */
  #type {
    position: fixed; inset: 0;
    padding: 5vh 6vw;
    color: var(--text);
    font-style: italic;
    font-size: clamp(1.6rem, 6.5vw, 3.4rem);
    line-height: 1.35;
    letter-spacing: .02em;
    word-break: break-all;
    overflow: hidden;
    text-shadow: 0 0 14px rgba(150, 185, 255, .6);
    transition: opacity 1.2s ease;
  }
  #type.fade { opacity: 0; }
  .caret {
    display: inline-block;
    width: .08em; height: 1em;
    background: var(--text);
    vertical-align: -0.12em;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="moon"></div>
  <div id="type"></div>

<script>
  var box = document.getElementById('type');
  var word = 'sorry ';
  var text = document.createTextNode('');
  var caret = document.createElement('span');
  caret.className = 'caret';
  box.appendChild(text);
  box.appendChild(caret);

  var i = 0;
  var speed = 70; // ms per letter

  function restart() {
    box.classList.add('fade');
    setTimeout(function () {
      text.nodeValue = '';
      i = 0;
      box.classList.remove('fade');
      setTimeout(typeNext, 400);
    }, 1300);
  }

  function typeNext() {
    var prev = text.nodeValue;
    text.nodeValue = prev + word.charAt(i % word.length);
    i++;
    // screen full -> remove the overflowing letter, pause, then start over forever
    if (box.scrollHeight > box.clientHeight + 1) {
      text.nodeValue = prev;
      setTimeout(restart, 1500);
      return;
    }
    setTimeout(typeNext, speed);
  }

  typeNext();
</script>
</body>
</html>
